# =============================================================================
# DOJEON API — 운영용 nginx 설정 (reverse proxy + edge rate limit + TLS 하드닝)
# 배포 위치: /etc/nginx/sites-available/dojeon-api  (sites-enabled 로 심볼릭 링크)
#
# 전제:
#   - 앱 컨테이너는 127.0.0.1:3000 에만 바인딩(docker-compose.yml). 외부 직접 노출 안 함.
#   - Let's Encrypt 인증서가 이미 발급됨: /etc/letsencrypt/live/api.dojeonkr.com/
#     (없으면 dojeon-api.bootstrap.conf 로 먼저 발급 후 이 파일로 교체)
#
# 주의: 이 파일은 nginx.conf 의 http{} 안에서 include 되므로
#       upstream / limit_req_zone / map 같은 http-context 지시어를 여기 둬도 된다.
# =============================================================================

# --- 업스트림 ---------------------------------------------------------------
# 현재는 단일 컨테이너(127.0.0.1:3000). 컨테이너 내부 PM2 cluster 가 CPU 코어 단위로 분산한다.
# 스케일아웃(노드/컨테이너 추가) 시 server 줄만 늘리면 nginx 가 least_conn 으로 분산한다.
# keepalive 로 업스트림 커넥션을 재사용(핸드셰이크 비용 절감) — 단일 노드에서도 성능 이득.
upstream dojeon_api {
    least_conn;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;   # 예: 컨테이너 추가 시
    keepalive 32;
}

# --- 레이트리밋 존(IP 기준) -------------------------------------------------
# 앱(NestJS Throttler)과 별개의 "edge 1차 방어". Node 에 닿기 전에 싸게 거른다.
limit_req_zone  $binary_remote_addr  zone=api_general:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr  zone=api_auth:10m     rate=5r/s;
limit_conn_zone $binary_remote_addr  zone=api_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# --- 80: ACME 챌린지 + HTTPS 강제 리다이렉트 --------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.dojeonkr.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 443: 본 서비스 ---------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dojeonkr.com;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/api.dojeonkr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dojeonkr.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # (선택) OCSP stapling — 사용 시 주석 해제:
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;

    # --- 보안 헤더 ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    server_tokens off;

    # --- 공통 프록시 설정(하위 location 이 상속) ---
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";          # keepalive 업스트림 재사용
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;            # SSE/긴 응답 대비
    proxy_buffering on;

    # --- 요청 제한 ---
    client_max_body_size 10m;
    limit_conn api_conn 50;               # IP당 동시연결 상한

    # Swagger 문서 — 팀만 접근(Basic Auth). UI/JSON/YAML 모두 잠가야 우회 불가.
    # 사전 준비: sudo htpasswd -c /etc/nginx/.htpasswd <아이디>  (비번은 대화형 입력)
    # 주의: 앱은 SWAGGER_ENABLED=true 여야 /docs 가 생성됨(false면 막을 것도 없이 404).
    location ~ ^/(docs|docs-json|docs-yaml) {
        auth_basic "DOJEON API Docs";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://dojeon_api;
    }

    # 인증 계열은 더 빡세게(브루트포스 1차 방어)
    location /auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://dojeon_api;
    }

    # 그 외 일반 API
    location / {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://dojeon_api;
    }

    # 숨김 파일 접근 차단(.env, .git 등 노출 방지)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
