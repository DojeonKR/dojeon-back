# DOJEON API — 부트스트랩(HTTP 전용) 설정
#
# 목적: Let's Encrypt 인증서를 "처음 발급"할 때만 잠깐 쓰는 최소 설정.
#       인증서 발급(certbot certonly --webroot) 후 dojeon-api.conf(HTTPS)로 교체한다.
#
# 배포:
#   sudo cp docker/nginx/dojeon-api.bootstrap.conf /etc/nginx/sites-available/dojeon-api
#   sudo ln -sf /etc/nginx/sites-available/dojeon-api /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.dojeonkr.com;

    # certbot webroot 챌린지 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 발급 전까지 임시로 프록시(서버 안에서 동작 확인용). 발급 후 HTTPS config로 교체된다.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
